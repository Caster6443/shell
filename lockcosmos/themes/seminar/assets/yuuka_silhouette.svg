      C 1260 230, 1340 260, 1375 320
      C 1390 350, 1400 400, 1410 440
      L 1380 430
      C 1375 390, 1350 360, 1330 345
      C 1340 375, 1345 415, 1345 460
      L 1320 430
      C 1315 390, 1290 360, 1280 345
      C 1285 385, 1285 435, 1270 480
      C 1260 450, 1245 420, 1240 380
      C 1220 410, 1205 450, 1195 500
      C 1185 450, 1180 380, 1185 320 Z
    "/>

    <!-- Hair Accessory: Millenium Clip & Cyan Antenna -->
    <path id="HairClipBase" fill="#141822" d="
      M 1075 180
      L 1105 185
      L 1060 290
      L 1030 280 Z
    "/>
    <path id="HairClipCyanLight" fill="#00d2ff" d="
      M 1083 190
      L 1095 192
      L 1075 250
      L 1063 248 Z
    "/>

    <!-- ============================================== -->
    <!-- 4. HALO (Top Constructivist Halo Ring) -->
    <!-- ============================================== -->
    <!-- Halo Base Ring (Outer Perspective Ellipse) -->
    <path id="HaloOuterRing" fill="url(#haloRimGrad)" d="
      M 1205 26
      C 1325 26, 1435 50, 1435 84
      C 1435 118, 1325 142, 1205 142
      C 1085 142, 975 118, 975 84
      C 975 50, 1085 26, 1205 26 Z
      M 1205 38
      C 1095 38, 995 59, 995 84
      C 995 109, 1095 130, 1205 130
      C 1315 130, 1415 109, 1415 84
      C 1415 59, 1315 38, 1205 38 Z
    " fill-rule="evenodd"/>

    <!-- Halo Inner Cyan Glowing Edge -->
    <path id="HaloCyanEdge" fill="url(#haloCyanGrad)" d="
      M 1205 40
      C 1310 40, 1405 60, 1405 84
      C 1405 92, 1390 100, 1365 107
      C 1350 97, 1280 82, 1205 82
      C 1130 82, 1060 97, 1045 107
      C 1020 100, 1005 92, 1005 84
      C 1005 60, 1100 40, 1205 40 Z
    "/>
  </g>
</svg>
